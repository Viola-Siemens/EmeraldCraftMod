plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = 'com.hexagram2021.emeraldcraft'

base {
    archivesName = project.archives_base_name + "-fabric"
}

loom {
    accessWidenerPath = file("src/main/resources/emeraldcraft.accesswidener")
    mixin {
        defaultRefmapName = "emeraldcraft.refmap.json"
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    maven { // TOP
        name = "Curse Maven"
        url = "https://cursemaven.com"
    }
    maven { // JEI
        name = "Progwml6's maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven { // JEI
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {// Forge Config API Port
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {// TerraBlender
        url = 'https://maven.minecraftforge.net/'
    }
    maven { // mirror
        name = "Mod Maven"
        url = "https://modmaven.dev"
    }
    maven { //parchment mapping
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {// CCA
        name = "Ladysnake Mods"
        url = 'https://maven.ladysnake.org/releases'
    }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    //mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-1.20.1:2023.06.26@zip")
    }

    modApi "com.google.code.findbugs:jsr305:3.0.2"

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-item:${project.cca_version}"
    include "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    include "dev.onyxstudios.cardinal-components-api:cardinal-components-item:${project.cca_version}"

    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forge_config_api_port_version}"

    modImplementation "curse.maven:jade-324717:6291330"

    modImplementation "mezz.jei:jei-1.20.1-fabric:15.20.0.112"

    modImplementation "com.github.glitchfiend:TerraBlender-fabric:${project.terrablender_version}"

    //modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    modImplementation "curse.maven:diet-443570:4813902"
    //------
    // support Diet mod
    modApi "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
    modApi "curse.maven:spectrelib-993948:5217601"
    //------

    modRuntimeOnly "curse.maven:appleskin-248787:4770825"
    //------
    // support appleskin mod
    modApi("me.shedaniel.cloth:cloth-config-fabric:11.1.136") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    //------

}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 17
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
    //it.options.compilerArgs += "-Xlint:none"
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
